
paths:
  data_dir: data
  log_dir: logs
  output_dir: output

thresholds:
  max_rejection_rate: 0.20
  min_price: 0

column_mappings:
  price: item_price
  freight_value: shipping_fee
  order_purchase_timestamp: purchased_at

files:
